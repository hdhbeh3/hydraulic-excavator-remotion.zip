
name: Render Hydraulic Excavator Short

on:
  workflow_dispatch:
    inputs:
      frames:
        description: "Test: 0-89 (leave empty for full video)"
        required: false
        default: ""

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract project ZIP
        run: |
          unzip -q hydraulic-excavator-remotion.zip -d .
          test -f exc/package.json
          test -f exc/src/index.ts

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 mesa-utils libgl1-mesa-dri libegl1
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Install project dependencies
        working-directory: exc
        run: npm install

      - name: Verify project
        working-directory: exc
        run: node scripts/verify.mjs

      - name: Render video
        working-directory: exc
        env:
          FRAMES: ${{ github.event.inputs.frames }}
        run: |
          mkdir -p out
          if [ -n "$FRAMES" ]; then
            npx remotion render src/index.ts HydraulicExcavator out/test.mp4 --frames="$FRAMES" --gl=angle --concurrency=2 --timeout=120000
          else
            npx remotion render src/index.ts HydraulicExcavator out/hydraulic-excavator.mp4 --gl=angle --concurrency=2 --crf=16 --timeout=120000
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: hydraulic-excavator-short
          path: exc/out/*.mp4
          

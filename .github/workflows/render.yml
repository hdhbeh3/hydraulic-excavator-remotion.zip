name: Render Hydraulic Excavator Short

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract project ZIP
        run: |
          ls -la
          unzip -q hydraulic-excavator-remotion-1.zip -d .
          test -f exc/package.json
          test -f exc/src/index.ts

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 libgl1-mesa-dri libegl1
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Install dependencies
        working-directory: exc
        run: npm install

      - name: Verify project
        working-directory: exc
        run: npm run verify

      - name: Render full video
        working-directory: exc
        run: |
          mkdir -p out
          npx remotion render src/index.ts HydraulicExcavator out/hydraulic-excavator.mp4 --gl=swangle --concurrency=2 --crf=16 --timeout=120000

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: hydraulic-excavator-final-video
          path: exc/out/*.mp4
          if-no-files-found: error
          
